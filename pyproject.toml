[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "icc-profile-organizer"
version = "0.1.0"
description = "A smart tool that automatically organizes ICC color profiles, EMX/EMY2 files, and PDFs by printer model and paper brand"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "narrowstacks" }]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=12.0.0",
    "textual>=6.5.0",
    "rich>=14.2.0",
]
keywords = ["icc", "color-profile", "printer", "organization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/narrowstacks/icc-profile-organizer"
Repository = "https://github.com/narrowstacks/icc-profile-organizer"

[project.scripts]
icc-organizer = "icc_profile_organizer.organize_profiles:main"
icc-config-wizard = "icc_profile_organizer.config_wizard:main"

# src/ layout: the single importable package is icc_profile_organizer.
# module-root defaults to "src", so only the module name needs to be set.
[tool.uv.build-backend]
module-name = "icc_profile_organizer"
