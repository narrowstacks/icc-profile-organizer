# Default configuration values for ICC Profile Organizer
# These serve as fallback values if config.yaml is not found or incomplete.
# NOTE: config.yaml replaces these top-level keys wholesale, so keep the
# printer_names / brand_name_mappings / printer_remappings here in sync
# with config.yaml. Filename patterns live only in config.yaml.

# Printer name mappings (canonical name: [aliases]).
#
# Aliases are matched case-insensitively as bounded substrings anywhere in a
# filename token, so one spelling covers "P900", "EpP900", "OEMSCP900" and
# "P900_700". The longest alias wins and a numeric edge must not touch another
# digit ("P900" never matches inside "P9000"). Aliases containing the
# pattern delimiter span several tokens ("CANpro-2_4_6_21_41_61").
#
# Vendors ship one profile set per printer family; family tokens map to the
# smallest model and printer_remappings collapse them onto the printer you own.
# Sources for the aliases: the download pages of Hahnemuehle, Canson Infinity,
# Moab, Red River, Ilford, Awagami, Breathing Color, Innova, PermaJet and
# Fotospeed plus the Epson/Canon driver profile sets (Sept 2026 survey).
