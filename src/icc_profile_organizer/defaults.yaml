# Collapse printers you do not own onto the one you do (one folder per
# physical printer). Vendors ship one profile set per family, so the members
# below share identical profiles with the target.
printer_remappings:
  Canon iPF8400: Canon iPF6450
  Canon iPF9400: Canon iPF6450
  Canon imagePROGRAF PRO-4000: Canon imagePROGRAF PRO-2000
  Canon imagePROGRAF PRO-6000: Canon imagePROGRAF PRO-2000
  Epson P700: Epson P900
  Epson P7500: Epson P7570
  Epson P9500: Epson P7570
  Epson P9570: Epson P7570
  Epson SureColor P7570: Epson P7570
