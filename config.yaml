# Printer name mappings (canonical name: [aliases]).
#
# Aliases are matched case-insensitively as bounded substrings anywhere in a
# filename token, so one spelling covers "P900", "EpP900", "OEMSCP900" and
# "P900_700". The longest alias wins and a numeric edge must not touch another
# digit ("P900" never matches inside "P9000"). Aliases containing the
# pattern delimiter span several tokens ("CANpro-2_4_6_21_41_61").
