# Filename patterns for parsing ICC/ICM/EMY2 files.
# Patterns are evaluated in priority order (higher priority first). Each
# pattern says how to pull printer, paper brand and paper type out of a
# filename; see configuration.md for the field reference.
#
# Per-pattern comments record where the vendor's naming/legend was read so it
# can be re-derived: the survey of every vendor download page is summarised
# in docs/vendor-filename-survey.md.
filename_patterns:
  # ---------------------------------------------------------------------------
  # MOAB  "MOAB <Paper> <printer> <media code>"
  # Examples: "MOAB Anasazi Canvas PRO-100 MPP", "MOAB Lasal Gloss Matte P7570-P9570 ECM",
  #           "MOAB Lasal Photo Matte P900 USFA -10%", "MOAB Somerset Museum Rag Epson 3880 VFA"
  # Everything after the printer token is a driver media setting and is dropped.
  # Source: moabpaper.com/icc-profiles-downloads (one zip per printer).
  - name: moab_profiles
    priority: 100
    description: "MOAB brand profiles with positional paper type"
    prefix: "MOAB "
    prefix_case_insensitive: true
    delimiter: " "
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"
      - field: code
        position: "after_printer"
    brand_value: "MOAB"
    paper_type_processing:
      format: true
      # "MOAB Somerset Velvet Epson 3880 VFA" -> the make precedes the model
      strip_regex: ['\s(Epson|Canon|Ep|Can)$']
      code_map_keep_rest: true
      code_map:
        Somerset Enh Velvet: Somerset Enhanced Velvet
        Entrada Nat: Entrada Rag Natural
        Entrada Brt: Entrada Rag Bright

  # ---------------------------------------------------------------------------
  # ILFORD Galerie  "ILFORD_<printer>_<paper code>[_<variant>]_<driver media>"
  # Examples: "ILFORD_EPSCX500_GPGFS_PGPP250", "ILFORD_CANpro-2_4_6_21_41_61_GTWE_Warm_JPW",
  #           "ILFORD_CANpro-100S_GPGFG17_PPPS", "ILFORD_EPP700_GTW-EW_USFAP"
  # The printer key may span several "_" parts; the paper code is resolved via
  # code_map (longest matching prefix) and the driver media suffix is dropped.
  # Legend: ilford.com/printer-profiles-paper-settings/ (per-printer tables,
  # served by ilford.com/ilford-profiles/multi-load-selected-profiles-via-ajax.php).
  - name: ilford_profiles
    priority: 95
    description: "ILFORD Galerie / Omnijet Studio profiles with abbreviated paper codes"
    prefix: "ILFORD_"
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: printer
        match_type: "substring"
      - field: paper_type
        position: "after_printer"
    brand_value: "Ilford"
    paper_type_processing:
      format: true   # Only used when a code is missing from code_map
      strip_regex: ['^series_ILFORD_', '^series_']
      code_map_file: vendor-legends/ilford.yaml

  # ILFORD legacy sets put the paper code first: "n_GPFAS_CANipf6300_FAPn",
  # "IGPTC19_EPSC800_USFAPn", "GPSPP12_CANipf6350_PSGP280n". No vendor prefix,
  # so the pattern only fires when the leading token is a known Ilford code.
  - name: ilford_legacy_profiles
    priority: 72
    description: "ILFORD legacy profiles: paper code before printer"
    prefix: null
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"
    brand_value: "Ilford"
    paper_type_processing:
      format: false
      strip_regex: ['^n_']
      require_code_map: true
      code_map_file: vendor-legends/ilford.yaml

  # ---------------------------------------------------------------------------
  # EPSON driver profiles and EMY2 media files  "EPSON SC-<model>[ <Brand>] <Paper>"
  # Examples: "EPSON SC-P900 Moab Entrada Rag Bright 190-300.emy2"
  #           "EPSON SC-P5300_MOAB Entrada Rag Natural 190.emy2"
  #           "EPSON_SC-P900_Awagami_Bamboo_Paper_110gsm.emy2"
  #           "EPSON SC-P900 Canson Infinity Platine Fibre Rag.emy2"
  #           "Epson_SC-P900_700_LegacyPlatine.icc"      (Epson driver, /Library/Printers/EPSON)
  #           "EPSON_SC-P9500_7500_PremiumLusterPhotoPaper260.icc"
  #           "SC-P9000_P7000_Series_V HotPressBright_MK_v1.icc" (EPSON/InkjetPrinter2)
  # "_" is accepted as a delimiter. After the printer token a known brand alias
  # (brand_name_mappings) is looked for; without one the file is an Epson-paper
  # profile. A second model number ("700" in "P900_700"), "Series V", the ink
  # marker and a version tag are dropped.
  - name: epson_sc_files
    priority: 90
    description: "EPSON SC-P### EMY2 files and Epson driver profiles"
    prefix: null
    prefix_regex: '^(EPSON )?SC-'
    prefix_case_insensitive: true
    delimiter: " "
    delimiter_aliases: ["_"]
    structure:
      - field: printer
        position: 0
      - field: brand
        match_type: "brand_search"
      - field: paper_type
        position: "after_brand"
    brand_value: null
    brand_fallback: "Epson"
    paper_type_processing:
      format: true
      strip_regex: ['^P?\d{3,5}\s', '^Series\sV\s', '\sv\d+$', '\s(MK|PK)$', '\sSeries$']

  # ---------------------------------------------------------------------------
  # Canon driver profiles  "CN_<model>_<version>_<Paper>[-P]"
  # Example: "CN_PRO-2000_520_FineArtPhoto.icc" (/Library/Printers/Canon/…/PRO2000.canonicc)
  - name: canon_driver_profiles
    priority: 90
    description: "Canon driver-bundled profiles"
    prefix: "CN_"
    prefix_case_insensitive: false
    delimiter: "_"
    structure:
      - field: printer
        match_type: "key_search"
      - field: paper_type
        position: "after_printer"
    brand_value: "Canon"
    paper_type_processing:
      format: true
      strip_regex: ['^\d+_', '-P$']

  # ---------------------------------------------------------------------------
  # Hahnemuehle  "HFA[Photo|Metallic]_<printer>_<MK|PK>_<Paper>[_BarytaSetting]"
  # Examples: "HFA_Can6450_MK_PhotoRag308", "HFAPhoto_EpsSC-P900_PK_GlossyFine",
  #           "HFA_CanPro1000_PK_PRBaryta_BarytaSetting", "HFA_CanPro2000_MK_Albrecht_Duerer"
  # PR = Photo Rag, FA = Fine Art; the code_map expands those and the artist
  # papers, keeping any weight that follows ("PRBaryta315" -> "Photo Rag Baryta 315").
  # Source: hahnemuehle.com/en/digital-papers/icc-profile/download-center.html
  - name: hfa_profiles
    priority: 85
    description: "Hahnemuehle HFA profiles with variant prefixes"
    prefix: "HFA"
    prefix_case_insensitive: false
    variants:
      - prefix: "HFAMetallic_"
        prefix_length: 12
      - prefix: "HFAPhoto_"
        prefix_length: 9
      - prefix: "HFA_"
        prefix_length: 4
    delimiter: "_"
    structure:
      - field: printer
        position: 0
      - field: mk_pk  # MK or PK marker
        position: 1
      - field: paper_type
        position: "2+"
    brand_value: "Hahnemuehle"
    paper_type_processing:
      format: true
      remove_brand: "Hahnemuehle"  # Strip brand name from paper type
      strip_regex: ['_BarytaSetting$', '-ab-charge-\d+$']
      code_map_keep_rest: true
      code_map:
        PRBaryta: Photo Rag Baryta
        PRBook: Photo Rag Book & Album
        PRBookAlbum: Photo Rag Book & Album
        PRBook_Album: Photo Rag Book & Album
        PRBookandAlbum: Photo Rag Book & Album
        PRBrightWhite: Photo Rag Bright White
        PRDuo: Photo Rag Duo
        PRMetallic: Photo Rag Metallic
        PRPearl: Photo Rag Pearl
        PRSatin: Photo Rag Satin
        PRUltraSmooth: Photo Rag Ultra Smooth
        PR-UltraSmooth: Photo Rag Ultra Smooth
        PR-Ultrasmooth: Photo Rag Ultra Smooth
        PhotoRagMattBaryta: Photo Rag Matt Baryta
        FABaryta: Fine Art Baryta
        FABarytaSatin: Fine Art Baryta Satin
        FABSatin: Fine Art Baryta Satin
        FAPearl: Fine Art Pearl
        BarytaFB: Baryta FB
        ADurer: Albrecht Duerer
        ADuerer: Albrecht Duerer
        Albrecht_Duerer: Albrecht Duerer
        WTurner: William Turner
        GermEtching: German Etching
        MusEtching: Museum Etching
        Hemp-Hanf: Hemp
        Agave-Sisal: Agave
        SilkBarytaX: Photo Silk Baryta X
        PhotoSilkBarytaX: Photo Silk Baryta X
        PhotoGlossBarytaX: Photo Gloss Baryta X
        HahnemuehlePhotoMatteFibre: Photo Matt Fibre
        HahnemuehlePhotoMatteFibreDuo: Photo Matt Fibre Duo

  # ---------------------------------------------------------------------------
  # Canson Infinity  "cifa_<printer>_<paper code><weight>[_<m|p>_bk]"
  # Examples: "cifa_p900_platine310_p_bk", "cifa_Can6450_edition2_310",
  #           "cifa_iPf_GP4000_ragphoto310", "CIFA_R2880_pmk310_M_BK"
  # "_m_bk"/"_p_bk" is the ink (matte/photo black) and is dropped. Codes are
  # expanded from the labels on canson-infinity.com/en/icc-profiles (the page
