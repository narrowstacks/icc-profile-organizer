        somerset_velvet_white: Somerset Enhanced Velvet White
        somerset_watercolour_white: Somerset Enhanced Watercolour White

  # ---------------------------------------------------------------------------
  # Awagami  "Awagami_<Paper>_<weight>gsm_<printer>_<media>"  /  "Awagami_<Paper>_<printer>.am1x"
  # Examples: "Awagami_Bamboo_Paper_110gsm_P900_VFA", "Awagami_Kozo_Thin_White_PRO-2000-6000_PFAS",
  #           "Awagami_Bizan_Natural_Medium_Handmade_GP-2000", "Awagami_Inbe_Thick_White_non-FP_GP-4000"
  # Source: awagami.com/pages/icc-profiles-and-printing-tips (one zip per file).
  - name: awagami_profiles
    priority: 88
    description: "Awagami washi profiles"
    prefix: "Awagami_"
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"
    brand_value: "Awagami"
    paper_type_processing:
      format: true
      strip_regex: ['_(non-)?FP$']   # GP-series: with / without fluorescent-pink ink

  # ---------------------------------------------------------------------------
  # Breathing Color  "BC_<Paper>_<printer>_[mk|pk]_<media>[_-NN]"
  # Examples: "BC_Lyve_P7570_mk_WCRW", "BC_VibranceBaryta_IPFx400_PK_CPSGP2280",
  #           "BC_Silverada_6400_PK_Sp1_-15", "BC_VibrancePhotoMatte_mk_P7000_WCRW"
  # Legend: breathingcolor.com/pages/icc-profile-instruction (app.breathingcolor.com API).
  - name: breathing_color_profiles
    priority: 88
    description: "Breathing Color profiles"
    prefix: "BC_"
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"
    brand_value: "Breathing Color"
    paper_type_processing:
      format: true
      strip_regex: ['_(mk|pk)$']
      code_map_keep_rest: true
      code_map:
        17M: 17M Satin Gloss
        17MSatin: 17M Satin
        17MGloss: 17M Gloss
        Lyve: Lyve Matte Canvas
        LyveCanvas: Lyve Matte Canvas
        Silverada: Silverada Metallic Canvas
        Crystalline: Crystalline Canvas
        Chromata: Chromata White Canvas
        ChromataWhite: Chromata White Canvas
        Optica: Optica One
        OpticaOne: Optica One
        VibGloss: Vibrance Gloss
        VibLuster: Vibrance Luster
        VibMetallic: Vibrance Metallic
        VibPhotoMatte: Vibrance Photo Matte
        Emblem: Emblem Textured Natural
        Insignia: Insignia Scrim Vinyl
        Silhouette: Silhouette Backlit Film
        Meridian: Meridian HD
        Renaissance: Renaissance Cotton
        RiverStone: River Stone Satin Rag
        RiverStoneRag: River Stone Satin Rag
        ArtPeelBlckt: Art Peel Blackout
        BagasseTex: Bagasse Textured
        BagasseText: Bagasse Textured

  # ---------------------------------------------------------------------------
  # Innova Art  "Innova_<printer>_<IFA code>_(<media>)_<MK|PK>_<quality>[-V2]"
  # Examples: "Innova_Canon_Pro-1000_IFA22_(HWFAP)_MK_Highest-V2",
  #           "Olmec_SC-P700_900_OLM62(EPG)_1440_D55_16bits_V2",
  #           "Innova_Canon-Pro2000_4000_IFA49_(PPPG2-280)_PK_highest_v2"
  # Paper is an IFA/OLM code; legend from the item list on innovaart.com/icc-profiles-1/
  # ("Etching Cotton Rag 315gsm - IFA 22"). Everything after the code is
  # media setting / print quality and is dropped.
  - name: innova_profiles
    priority: 86
    description: "Innova Art and Olmec profiles with IFA/OLM paper codes"
    prefix: null
    prefix_regex: '^(Innova[_-]|Olmec_|Inn-)'
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: printer
        match_type: "key_search"
      - field: paper_type
        position: "after_printer"
    brand_value: "Innova"
    paper_type_processing:
      format: true
      code_map_file: vendor-legends/innova.yaml

  # Innova files that carry no vendor prefix: "Canon_PixmaPro9500mk2_IFA22",
  # "iPFx300_IFA36_High", "IPF63X0_IFA22_StTexCot315". Only fires when the
  # token after the printer is a known IFA/OLM code.
  - name: innova_legacy_profiles
    priority: 71
    description: "Innova legacy profiles without vendor prefix (IFA/OLM code after printer)"
    prefix: null
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: printer
        match_type: "key_search"
      - field: paper_type
        position: "after_printer"
    brand_value: "Innova"
    paper_type_processing:
      format: false
      require_code_map: true
      code_map_file: vendor-legends/innova.yaml

  # ---------------------------------------------------------------------------
  # PermaJet  "[NN.]APJ_<printer token>_<Paper>_<media>"
  # Examples: "APJ_OEMPro1000_FBGoldSilk_PPPP", "APJ_OEMSCP900_TitaniumLustre_PLPP",
  #           "40.APJ_EPSONSCP900MK_OEM_WALLARTMATT170_EAM", "APJ_OEMPRO1000_BARYTA_RAG_310_BarytaPP"
  # The printer token glues make/ink onto the model ("OEMSCP900", "CANONPRO1100MK");
  # the last "_" token is the driver media setting. Upper-case paper names are
  # expanded via code_map. Legend: permajet.com/icc-profiles/ (page embeds the
  # profile table as JSON, zips come from admin-ajax.php?action=request_icc_profile_zip).
  - name: permajet_profiles
    priority: 86
    description: "PermaJet profiles"
    prefix: null
    prefix_regex: '^(\d+\.)?APJ_'
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: printer
        match_type: "key_search"
      - field: paper_type
        position: "after_printer"
    brand_value: "PermaJet"
    paper_type_processing:
      format: true
      strip_regex: ['^OEM_', '^(MK|PK)_', '_[A-Za-z0-9]+$']   # ink marker, driver media token
      code_map_file: vendor-legends/permajet.yaml

  # ---------------------------------------------------------------------------
  # Fotospeed  "1FS_<Paper>_<printer>_Generic[...]"  (1FA_ for the Fine Art range)
  # Examples: "1FS_PFLustre_SC-P900_Generic", "1FS_NSTBrightWhite_Canon-Pro1100_Generic",
  #           "1FS_ArtSmoothDuo_Canon-Pro-1000-Generic-20-06-22", "1FA_PlatinumEtching_iPF6400_Generic"
  # Source: fotospeed.com/profiles/ (per printer/ink pages). Naming is loose;
  # the code_map expands the vendor's abbreviations (NST = Natural Soft
  # Textured, HWS = High White Smooth, PF = Pearl/Platinum Fibre range).
  - name: fotospeed_profiles
    priority: 84
    description: "Fotospeed profiles"
    prefix: null
    prefix_regex: '^1F[SA][_-]'
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"
    brand_value: "Fotospeed"
    paper_type_processing:
      format: true
      strip_regex: ['^~', '_(Epson|Canon|Generic)$']
      code_map_keep_rest: true
      code_map:
        NST: Natural Soft Textured
        NSTBrightWhite: Natural Soft Textured Bright White
        NT: Natural Textured
        NTBrightWhite: Natural Textured Bright White
        HWS: High White Smooth
        DCFilm: Digital Contact Film
        PFLustre: PF Lustre
        PFLustreDuo: PF Lustre Duo
        PFGloss: PF Gloss
        ArtSmootDuo: Art Smooth Duo
        HWSDuo: High White Smooth Duo
        HWSLite: High White Smooth Lite
        HWSLT: High White Smooth Lite
        HWSLt: High White Smooth Lite
        HWSLiteDuo: High White Smooth Lite Duo
        HWSLtDuo: High White Smooth Lite Duo
        HighWhiteSmoothDUO: High White Smooth Duo
        HighWhiteSmoothLITE: High White Smooth Lite
        NatSoftText: Natural Soft Textured
        NatText: Natural Textured
        MattDUO: Matt Duo

  # ---------------------------------------------------------------------------
  # Red River Paper  "RR <Paper> <Ep|Can> <printer>[ MK|PK][ vN]"
  # Examples: "RR Arctic Polar Luster Ep 7570-9750", "RR Palo Duro Matte Canvas P9570 P7570",
  #           "RR UltraPro Satin 4.0 Ep P900", "RR Polar Matte Canon Pro-100 v2",
  #           "RR UPSatin 4.0 EpR3000", "RR Big Bend Baryta Can iPFX400"
  # The make token before the printer is stripped; abbreviations expand via
  # code_map and the product version that follows is kept ("UPSatin 4.0" ->
  # "UltraPro Satin 4.0"). Source: redrivercatalog.com/profiles/ (per-printer zips).
  - name: red_river_profiles
    priority: 75
    description: "Red River Papers ICC profiles"
    prefix: "RR "
    prefix_case_insensitive: false
    delimiter: " "
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"
    brand_value: "Red River"
    paper_type_processing:
      format: true
      strip_regex: ['\s(Epson|Canon|Ep|Can|HP)$', '\s(Epson|Canon|Ep|Can|HP)\s(SC|SureColor|Stylus|Pro|Pixma)$']
      code_map_keep_rest: true
      code_map_file: vendor-legends/redriver.yaml

  # Red River EMY2 documentation files carry no printer in the name:
  # "Red River Paper_RR Arctic Polar Luster (75lb).emy2"
  - name: red_river_emy2_files
    priority: 74
    description: "Red River Papers EMY2 documentation files"
    prefix: "Red River Paper_RR "
    prefix_case_insensitive: true
    delimiter: " "
    structure:
      - field: paper_type
        position: "0+"
    brand_value: "Red River"
    paper_type_processing:
      format: true
      code_map_keep_rest: true
      code_map_file: vendor-legends/redriver.yaml

  # ---------------------------------------------------------------------------
  # Fallback: any known printer token anywhere in the name
  - name: fallback_printer_detection
    priority: 10
    description: "Fallback: find any printer key in filename"
    prefix: null
    prefix_case_insensitive: true
    delimiter: " "
    structure:
      - field: printer
        match_type: "substring"
      - field: paper_type
        position: "remaining"
    brand_value: "Unknown"
    paper_type_processing:
      format: true

# Preprocessing applied to all filenames before pattern matching
# Examples: "MOAB+Lasal+Gloss+PRO-100+OGP.icc" -> "MOAB Lasal Gloss PRO-100 OGP"
preprocessing:
  normalize_plus_to_space: true
