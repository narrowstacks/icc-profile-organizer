# Filename patterns for parsing ICC profiles and EMY2 files
# Patterns are evaluated in priority order (higher priority first)
# Each pattern defines how to extract printer, paper brand, and paper type from filenames
filename_patterns:
  # Pattern 1: MOAB profiles (brand prefix with positional paper type)
  # Examples: "MOAB Anasazi Canvas PRO-100 MPP", "MOAB Lasal Gloss Matte P7570-P9570 ECM"
  - name: moab_profiles
    priority: 100
    description: "MOAB brand profiles with positional paper type"
    prefix: "MOAB "
    prefix_case_insensitive: true
    delimiter: " "
    # Structure: paper type comes before printer, code after
    structure:
      - field: paper_type
        position: "before_printer"
      - field: printer
        match_type: "key_search"  # Search through printer keys
      - field: code
        position: "after_printer"
    brand_value: "MOAB"
    paper_type_processing:
      format: true  # Apply CamelCase separation

  # Pattern 2: EPSON SC- EMY2 files (manufacturer + model prefix)
  # Examples: "EPSON SC-P900 Moab Entrada Rag Bright 190"
  - name: epson_sc_files
    priority: 90
    description: "EPSON SC-P### EMY2 files with fixed position parsing"
    prefix: "EPSON SC-"
    prefix_case_insensitive: false
    delimiter: " "
    structure:
      - field: printer
        position: 0  # "P900" at index 0 (after prefix removed)
      - field: brand
        position: 1  # e.g., "Moab" at index 1
      - field: paper_type
        position: "2+"  # Rest is paper type
    brand_value: null  # Use position 1
    paper_type_processing:
      format: true

  # Pattern 3: Canson/CIFA profiles (brand code with underscore separation)
  # Examples: "cifa_pixmapro100_baryta2_310", "cifa_Can6450_Photo_Rag_308"
  - name: cifa_profiles
    priority: 80
    description: "Canson/CIFA profiles with underscore-delimited structure"
    prefix: "cifa_"
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: printer
        position: 0
      - field: paper_type
        position: "1+"
    brand_value: "Canson"
    paper_type_processing:
      format: true

  # Pattern 4: Hahnemuehle (HFA) base profiles (brand code with variants)
  # Variants: "HFA_", "HFAPhoto_", "HFAMetallic_"
  # Examples: "HFA_Can6450_MK_PhotoRag308", "HFAPhoto_EpsSC-P900_PK_GlossyFine"
  - name: hfa_profiles
    priority: 85
    description: "Hahnemuehle HFA profiles with variant prefixes"
    prefix: "HFA"
    prefix_case_insensitive: false
    # Multiple variants with different prefix lengths
    variants:
      - prefix: "HFAMetallic_"
        prefix_length: 12
      - prefix: "HFAPhoto_"
        prefix_length: 9
      - prefix: "HFA_"
        prefix_length: 4
    delimiter: "_"
    structure:
      - field: printer
        position: 0
      - field: mk_pk  # MK or PK marker
        position: 1
      - field: paper_type
        position: "2+"
    brand_value: "Hahnemuehle"
    paper_type_processing:
      format: true
      remove_brand: "Hahnemuehle"  # Strip brand name from paper type

  # Pattern 5: Red River Papers (ICC Profiles with Printer Info)
  # Examples: "RR Arctic Polar Luster Ep 7570-9750", "RR Palo Duro Matte Canvas P9570 P7570"
  - name: red_river_profiles
    priority: 75
    description: "Red River Papers ICC profiles"
    prefix: "RR "
    prefix_case_insensitive: false
    delimiter: " "
    structure:
      - field: paper_type
        position: "before_printer"  # Everything before printer model
      - field: printer
        match_type: "key_search"    # Search for printer keys in remaining parts
    brand_value: "Red River"
    paper_type_processing:
      format: true
      remove_brand: "Ep"  # Remove "Ep" prefix (Epson indicator)

  # Pattern 5b: Red River Papers (EMY2 Documentation Files - No Printer in Filename)
  # Examples: "Red River Paper_RR Arctic Polar Luster (75lb).emy2"
  # Note: These are documentation files without printer info in filename
  - name: red_river_emy2_files
    priority: 74
    description: "Red River Papers EMY2 documentation files"
    prefix: "Red River Paper_RR "
    prefix_case_insensitive: true
    delimiter: " "
    structure:
      - field: paper_type
        position: "0+"  # Everything after prefix is paper type
    brand_value: "Red River"
    paper_type_processing:
      format: true

  # Pattern 5c: ILFORD Galerie profiles (abbreviated paper codes)
  # Format: ILFORD_<printer>_<paper code>[_<variant>]_<driver media setting>
  # Examples: "ILFORD_EPSCX500_GPGFS_PGPP250", "ILFORD_CANpro-2_4_6_21_41_61_GTWE_Warm_JPW",
  #           "ILFORD_CANpro-100S_GPGFG17_PPPS"
  # The printer key may span several "_" parts; the paper code is resolved via
  # code_map (longest matching prefix), and the driver media suffix is dropped.
  # Code legend: https://ilford.com/printer-profiles-paper-settings/ (per-printer listings)
  - name: ilford_profiles
    priority: 95
    description: "ILFORD Galerie profiles with abbreviated paper codes"
    prefix: "ILFORD_"
    prefix_case_insensitive: true
    delimiter: "_"
    structure:
      - field: printer
        match_type: "substring"
      - field: paper_type
        position: "after_printer"
    brand_value: "Ilford"
    paper_type_processing:
      format: true   # Only used when a code is missing from code_map
      code_map:
        # Pro photo / baryta
        GCG: Crystal Gloss
        GPCG: Crystal Gloss
        IGPGP: Gloss
        IGPLP: Lustre
        IGPSP: Satin Photo
        GPSGP: Smooth Gloss
        GPSPP: Smooth Pearl
        GPMG: Metallic Gloss
        GPRP: Raster Silk
        GPGFG: Gold Fibre Gloss
        GPGFS: Gold Fibre Silk
        GPGMS: Gold Mono Silk
        GPMSW: Mono Silk Warmtone
        GGFP: Gold Fibre Pearl
        GPFP: Gold Fibre Pearl
        GGFR: Gold Fibre Rag
        # Duo
        GPHWM: Heavyweight Duo Matt
        IGPMD: Premium Matt Duo
        GPSGD: Semigloss Duo
        GLPD: Lustre Photo Duo
        GPLPD: Lustre Photo Duo
        # Fine art cotton / matt
        GPSC: Smooth Cotton Rag
        GPTC: Textured Cotton Rag
        GPCAT: Cotton Artist Textured
        GSCS: Smooth Cotton Sonora
        GPSCS: Smooth Cotton Sonora
        GMCM: Matt Cotton Medina
        GSCSJ: Smooth Cotton Sprite 280
        GTCSJ: Textured Cotton Sprite 280
        GSCPJ: Smooth Cotton Pearlescent
        GTCPJ: Textured Cotton Pearlescent
        GPFAS: Fine Art Smooth
        GPFASP: Fine Art Smooth Pearl
        GPFATS: Fine Art Textured Silk
        # Washi
        GPWT: Washi Torinoko
        GTWE: Tesuki-Washi Echizen 110
        GTWE_Neutral: Tesuki-Washi Echizen 110
        GTWE_Warm: Tesuki-Washi Echizen 110 Warmtone
        GTWE_Pearl: Tesuki-Washi Echizen 110 Pearl
        GTWE110nt: Tesuki-Washi Echizen 110
        GTWE110wt: Tesuki-Washi Echizen 110 Warmtone
        GTWEP110: Tesuki-Washi Echizen 110 Pearl
        # Canvas
        GPCN: Canvas Natural
        CPCN: Canvas Natural
        GPFACG: Canvas Galicia
        GPSFAC: Smooth Fine Art Canvas
        GDCBW: Decor Canvas Bright White 380
        GDCG: Decor Canvas Glossy 400
        GDCMC: Decor Canvas Matt Cotton 370

  # Pattern 6: Fallback - substring printer detection
  # Used when specific patterns don't match
  - name: fallback_printer_detection
    priority: 10
    description: "Fallback: find any printer key in filename"
    prefix: null
    prefix_case_insensitive: true
    delimiter: " "
    structure:
      - field: printer
        match_type: "substring"  # Case-insensitive substring search
      - field: paper_type
        position: "remaining"  # Everything except printer key
    brand_value: "Unknown"
    paper_type_processing:
      format: true

# Preprocessing applied to all filenames before pattern matching
# Examples: "MOAB+Lasal+Gloss+PRO-100+OGP.icc" -> "MOAB Lasal Gloss PRO-100 OGP"
preprocessing:
  normalize_plus_to_space: true
